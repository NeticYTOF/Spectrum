[package]
name = "spectrum"
version = "0.1.0"
edition = "2021"
description = "A terminal-native audio visualizer with real-time FFT analysis"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
crossterm = "0.28"
ratatui = "0.29"
rodio = "0.19"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Control", "Foundation"] }

[profile.release]
lto = true
codegen-units = 1
