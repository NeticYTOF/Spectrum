[package]
name = "spectrum"
version = "0.1.0"
edition = "2021"
description = "A terminal-native audio visualizer with real-time FFT analysis"
license = "MIT"

[dependencies]
# Pure-Rust outline rasterizer for the garden's genuine Playfair Display
# type (embedded unmodified, OFL-1.1; see assets/fonts and NOTICE).
ab_glyph = "0.2.32"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
crossterm = "0.28"
ratatui = "0.29"
rodio = "0.19"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Control", "Foundation"] }

[profile.release]
lto = true
codegen-units = 1
